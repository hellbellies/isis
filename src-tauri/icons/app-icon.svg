<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of the app icons. Regenerate with `pnpm tauri icon src-tauri/icons/app-icon.svg`,
       then delete the generated android/, ios/ and 64x64.png (desktop only). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="236" x2="0" y2="798">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS-style tile: 824px square with a 100px margin. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g fill="url(#gold)" filter="url(#shadow)">
    <!-- Capital -->
    <path d="M432 300 Q432 236 512 236 Q592 236 592 300 Z"/>
    <!-- Four bars -->
    <rect x="352" y="310" width="320" height="46" rx="14"/>
    <rect x="352" y="374" width="320" height="46" rx="14"/>
    <rect x="352" y="438" width="320" height="46" rx="14"/>
    <rect x="352" y="502" width="320" height="46" rx="14"/>
    <!-- Shaft, slightly widening -->
    <path d="M442 566 L582 566 L604 742 L420 742 Z"/>
    <!-- Base -->
    <rect x="372" y="756" width="280" height="42" rx="14"/>
  </g>
</svg>
